# Патч DeepSeek Harness: один провайдер навыков на весь каталог `skills/`.
#
# Строка живёт на уровне хоста, поэтому навыки попадают в глобальный слой
# реестра и видны любому агенту, у которого смонтирован `dsh-tool-skill`;
# пресеты и их состав не меняются. Относительный `name` раскрывается рядом с
# этим файлом — внутри установленного пакета, а не в каталоге профиля.
- insert:
    - id: skills-kit
      name: './dsh-plugin.js'
